    // 選ばれたスポットの詳細情報をモーダルに表示する
    function showDia(ttl, dataSet = activeData) {
      const dat = dataSet[ttl];
      if (dat) {
        const html_c = `
          <h3>${ttl}</h3>
          <img src="${dat.phot}" alt="${ttl}" class="sp-t">
          <p class="sp-b">${dat.bun}</p>
        `;
        $('#dia').html(html_c);
        $('#info').addClass('show');
      }
    }

    // モーダルをマウスでドラッグできるようにする
    function makeDraggable(card) {
      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      card.addEventListener('pointerdown', (event) => {
        if (event.target.closest('#info-close')) return;
        isDragging = true;
        card.setPointerCapture(event.pointerId);
        const rect = card.getBoundingClientRect();
        const parentRect = card.offsetParent ? card.offsetParent.getBoundingClientRect() : { left: 0, top: 0 };
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;
        card.style.left = `${rect.left - parentRect.left}px`;
        card.style.top = `${rect.top - parentRect.top}px`;
        card.style.right = 'auto';
        card.style.bottom = 'auto';
      });

      card.addEventListener('pointermove', (event) => {
        if (!isDragging) return;
        const parentRect = card.offsetParent ? card.offsetParent.getBoundingClientRect() : { left: 0, top: 0 };
        const x = event.clientX - parentRect.left - offsetX;
        const y = event.clientY - parentRect.top - offsetY;
        card.style.left = `${x}px`;
        card.style.right = 'auto';
        card.style.top = `${y}px`;
        card.style.bottom = 'auto';
      });

      card.addEventListener('pointerup', () => {
        isDragging = false;
      });
      card.addEventListener('pointercancel', () => {
        isDragging = false;
      });
    }

    function hideDia() {
      $('#info').removeClass('show');
    }

    // 選ばれたスポットに地図を移動し、モーダルも表示する
    function moveToSpot(ttl, dataSet = activeData) {
      const dat = dataSet[ttl];
      const mapEl = document.getElementById('my-map');

      if (!dat || !mapEl) return;

      mapEl.setAttribute('center', `${dat.pos.lat},${dat.pos.lng}`);
      mapEl.setAttribute('zoom', '15');

      if (mapEl.innerMap) {
        mapEl.innerMap.panTo(dat.pos);
        mapEl.innerMap.setZoom(15);
      }

      showDia(ttl, dataSet);
    }

    // 現在のカテゴリに対応するマーカーを地図に描画する
    function renderMarkers(dataSet) {
      const mapEl = document.getElementById('my-map');
      if (!mapEl) return;

      Array.from(mapEl.children).forEach(child => {
        if (child.tagName === 'GMP-ADVANCED-MARKER' && child.id !== 'current-location-marker') {
          mapEl.removeChild(child);
        }
      });

      Object.keys(dataSet).forEach(ttl => {
        const markerEl = document.createElement('gmp-advanced-marker');
        const item = dataSet[ttl];
        markerEl.setAttribute('position', `${item.pos.lat},${item.pos.lng}`);
        markerEl.setAttribute('title', ttl);
        markerEl.addEventListener('click', () => {
          moveToSpot(ttl, dataSet);
        });
        mapEl.appendChild(markerEl);
      });
    }

    // 検索ワードに応じて一覧の表示を絞り込む
    function applySearchFilter() {
      const searchInput = $('#search-input');
      const keyword = searchInput.val().trim().toLowerCase();
      const emptyState = $('#empty-state');
      let hasVisible = false;

      currentButtons.forEach(btn => {
        const match = btn.text().toLowerCase().includes(keyword);
        btn.toggle(match);
        if (match) hasVisible = true;
      });

      emptyState.toggle(!hasVisible && keyword !== '');
    }

    // サイドバーにスポットのボタン一覧を作る
    function renderButtonList(dataSet) {
      const btnLst = $('#btn-lst');
      btnLst.empty();
      currentButtons = [];

      Object.keys(dataSet).forEach(ttl => {
        const btn = $('<button>')
          .addClass('side-btn')
          .text(ttl)
          .on('click', () => {
            moveToSpot(ttl, dataSet);
          });
        currentButtons.push(btn);
        btnLst.append(btn);
      });

      btnLst.append('<div id="empty-state" class="empty-state">該当するスポットがありません</div>');
      applySearchFilter();
    }

    // カテゴリ切り替えを行い、地図・一覧・モーダルを更新する
    function setActiveCategory(key) {
      activeDataKey = key;
      activeData = datasets[key];
      $('.cat-btn').removeClass('active');
      $(`.cat-btn[data-key="${key}"]`).addClass('active');
      hideDia();
      renderMarkers(activeData);
      renderButtonList(activeData);
    }

    // 現在地を取得して地図の中心に表示する
    function showCurrentLocation() {
      const mapEl = document.getElementById('my-map');
      const locateBtn = document.getElementById('locate-btn');

      if (!mapEl || !navigator.geolocation) {
        alert('このブラウザでは位置情報を取得できません。');
        return;
      }

      if (locateBtn) {
        locateBtn.disabled = true;
        locateBtn.textContent = '取得中...';
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const pos = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          mapEl.setAttribute('center', `${pos.lat},${pos.lng}`);
          mapEl.setAttribute('zoom', '16');

          if (mapEl.innerMap) {
            mapEl.innerMap.panTo(pos);
            mapEl.innerMap.setZoom(16);
          }

          let markerEl = document.getElementById('current-location-marker');
          if (!markerEl) {
            markerEl = document.createElement('gmp-advanced-marker');
            markerEl.id = 'current-location-marker';
            markerEl.setAttribute('title', '現在地');
            mapEl.appendChild(markerEl);
          }
          markerEl.setAttribute('position', `${pos.lat},${pos.lng}`);

          if (locateBtn) {
            locateBtn.disabled = false;
            locateBtn.textContent = '📍 現在地';
          }
        },
        () => {
          alert('位置情報の取得に失敗しました。');
          if (locateBtn) {
            locateBtn.disabled = false;
            locateBtn.textContent = '📍 現在地';
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // ページ読み込み後にイベントを登録し、初期表示を設定する
    document.addEventListener('DOMContentLoaded', () => {
      const btnLst = $('#btn-lst');
      const searchInput = $('#search-input');

      $('#info-close').on('click', hideDia);
      $('#locate-btn').on('click', showCurrentLocation);
      makeDraggable(document.getElementById('info'));
      $('.cat-btn').on('click', function () {
        setActiveCategory($(this).data('key'));
      });

      searchInput.on('input', applySearchFilter);

      $('#search-btn').on('click', () => {
        searchInput.trigger('input');
      });

      setActiveCategory('spots');
    });

  </script>

</body>

</html>
